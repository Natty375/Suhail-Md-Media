const { spawnSync, spawn } = require('child_process');
const { existsSync, writeFileSync, readFileSync } = require('fs');
const path = require('path');

const SESSION_ID = 'levanter_17a47d57e4633f42e1b50c795cc0a839c7'; // Edit this line only, don't remove ' <- this symbol

let nodeRestartCount = 0;
const maxNodeRestarts = 5;
const restartWindow = 30000; // 30 seconds
let lastRestartTime = Date.now();

const BAN_LIST_PATH = 'banned_users.json'; // Path to store banned users
let bannedUsers = [];

// List of sudo users who are exempt from banning or restart limits
const sudoUsers = ['0796055838', '0769728981'];

function isSudoUser() {
  return sudoUsers.includes(SESSION_ID);
}

// Load the ban list from file if it exists
if (existsSync(BAN_LIST_PATH)) {
  const bannedData = readFileSync(BAN_LIST_PATH, 'utf-8');
  bannedUsers = JSON.parse(bannedData);
}

// Function to check if the current user is banned
function isBanned() {
  return !isSudoUser() && bannedUsers.includes(SESSION_ID);
}

// Function to ban the current user
function banUser() {
  if (!isSudoUser() && !isBanned()) {
    bannedUsers.push(SESSION_ID);
    writeFileSync(BAN_LIST_PATH, JSON.stringify(bannedUsers, null, 2));
    console.error(`SESSION_ID ${SESSION_ID} has been banned due to excessive restarts.`);
  }
}

// Check if the user is banned at the start
if (isBanned()) {
  console.error(`SESSION_ID ${SESSION_ID} is banned. Aborting process.`);
  process.exit(1); // Exit the script if banned
}

function startNode() {
  const child = spawn('node', ['index.js'], { cwd: 'levanter', stdio: 'inherit' });

  child.on('exit', (code) => {
    if (code !== 0) {
      const currentTime = Date.now();
      if (currentTime - lastRestartTime > restartWindow) {
        nodeRestartCount = 0;
      }
      lastRestartTime = currentTime;
      nodeRestartCount++;

      if (nodeRestartCount > maxNodeRestarts && !isSudoUser()) {
        console.error('Node.js process is restarting continuously. Stopping retries...');
        banUser(); // Ban the user if restarts exceed the limit
        return;
      }
      console.log(`Node.js process exited with code ${code}. Restarting... (Attempt ${nodeRestartCount})`);
      startNode();
    }
  });
}

function startPm2() {
  const pm2 = spawn('yarn', ['pm2', 'start', 'index.js', '--name', 'levanter', '--attach'], {
    cwd: 'levanter',
    stdio: ['pipe', 'pipe', 'pipe'],
  });

  let restartCount = 0;
  const maxRestarts = 5;

  pm2.on('exit', (code) => {
    if (code !== 0) {
      startNode();
    }
  });

  pm2.on('error', (error) => {
    console.error(`yarn pm2 error: ${error.message}`);
    startNode();
  });

  // Check for infinite restarts
  if (pm2.stderr) {
    pm2.stderr.on('data', (data) => {
      const output = data.toString();
      if (output.includes('restart')) {
        restartCount++;
        if (restartCount > maxRestarts) {
          spawnSync('yarn', ['pm2', 'delete', 'levanter'], { cwd: 'levanter', stdio: 'inherit' });
          startNode();
        }
      }
    });
  }

  if (pm2.stdout) {
    pm2.stdout.on('data', (data) => {
      const output = data.toString();
      console.log(output);
      if (output.includes('Connecting')) {
        restartCount = 0;
      }
    });
  }
}

function installDependencies() {
  const installResult = spawnSync(
    'yarn',
    ['install', '--force', '--non-interactive', '--network-concurrency', '3'],
    {
      cwd: 'levanter',
      stdio: 'inherit',
      env: { ...process.env, CI: 'true' },
    }
  );

  if (installResult.error || installResult.status !== 0) {
    console.error(`Failed to install dependencies: ${installResult.error ? installResult.error.message : 'Unknown error'}`);
    process.exit(1);
  }
}

function checkDependencies() {
  if (!existsSync(path.resolve('levanter/package.json'))) {
    console.error('package.json not found!');
    process.exit(1);
  }

  const result = spawnSync('yarn', ['check', '--verify-tree'], {
    cwd: 'levanter',
    stdio: 'inherit',
  });

  if (result.status !== 0) {
    console.log('Some dependencies are missing or incorrectly installed.');
    installDependencies();
  }
}

function cloneRepository() {
  const cloneResult = spawnSync(
    'git',
    ['clone', 'https://github.com/lyfe00011/levanter.git', 'levanter'],
    {
      stdio: 'inherit',
    }
  );

  if (cloneResult.error) {
    throw new Error(`Failed to clone the repository: ${cloneResult.error.message}`);
  }

  const configPath = 'levanter/config.env';
  try {
    writeFileSync(configPath, `VPS=true\nSESSION_ID=${SESSION_ID}`);
  } catch (err) {
    throw new Error(`Failed to write to config.env: ${err.message}`);
  }

  installDependencies();
}

// Start the process
if (!existsSync('levanter')) {
  cloneRepository();
  checkDependencies();
} else {
  checkDependencies();
}

startPm2();
